name: ios
# The game for iPhone and iPad, and nothing else: the Rust game cross-compiled for aarch64-apple-ios, wrapped by
# packaging/ios/project.yml's HorizonGame target, and uploaded as an unsigned .ipa. No tests run here. The .ipa is then posted to Discord when the repository secret
# DISCORD_IPA_WEBHOOK is set.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.sha }}
  cancel-in-progress: false
env:
  HORIZON_TELEMETRY_URL: "off"
  IOS_TARGET: aarch64-apple-ios
  # `--release` with the `fast` profile's codegen: the release profile's single codegen unit and LTO cost minutes
  # and the unsigned bundle is a test build.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_INCREMENTAL: "0"
  # The app's own minimum (project.yml); rustc and cc read it, and the Xcode step's Cargo phase sees the same.
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"

jobs:
  ipa:
    # macos-14 stopped being handed out on 2026-10-27 ("not acquired by Runner of type hosted"); MAC_RUNNER overrides.
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.IOS_TARGET }}
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: ios-${{ env.IOS_TARGET }}
      - name: Build the game
        # The Microsoft sign-in app (msa.rs): a repository variable overrides the built-in one; unset, it stays.
        env:
          HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
        # The defaults minus `controllers` (GameController reads pads), with `audio`: project.yml's Cargo phase
        # uses the same flags, so HORIZON_GAME_PREBUILT below finds this build.
        run: cargo build --release --locked --target "$IOS_TARGET" -p horizon-client --no-default-features --features audio
      - name: Bundle it
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          ( cd packaging/ios && xcodegen generate )
          HORIZON_GAME_PREBUILT=1 xcodebuild -project packaging/ios/HorizonIOS.xcodeproj \
            -target HorizonGame -configuration Release -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build-ios" \
            build > xcode-game-build.log 2>&1 || { tail -60 xcode-game-build.log; exit 1; }
          rm -rf game-xcode && mkdir -p game-xcode/Payload
          cp -a build-ios/HorizonGame.app game-xcode/Payload/
          ( cd game-xcode && zip -qry ../Horizon-game-unsigned.ipa Payload )
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-game
          path: Horizon-game-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Send the .ipa to Discord
        if: env.DISCORD_IPA_WEBHOOK != ''
        env:
          DISCORD_IPA_WEBHOOK: ${{ secrets.DISCORD_IPA_WEBHOOK }}
        run: |
          set -uo pipefail
          # Never post Mojang's files: a bundle with prepared resources in it carries this marker.
          if unzip -l Horizon-game-unsigned.ipa | grep -q horizon-resources.json; then
            echo "::error::the .ipa carries prepared vanilla assets; refusing to post it"
            exit 1
          fi
          content=$(printf '%s\n' \
            "**Horizon for iPhone and iPad, run #${GITHUB_RUN_NUMBER}**" \
            "\`${GITHUB_REF_NAME}@${GITHUB_SHA::7}\`: an unsigned .ipa, with no assets" \
            "🤖 Posted by \`.github/workflows/ios.yml\`, not by a person.")
          response=$(mktemp)
          code=$(curl -sS -o "$response" -w '%{http_code}' -X POST "$DISCORD_IPA_WEBHOOK" \
            -F "content=$content" -F "file=@Horizon-game-unsigned.ipa;type=application/octet-stream")
          case "$code" in
            2*) echo "Posted the .ipa to Discord (HTTP $code)." ;;
            *)
              echo "::error::Discord refused the file (HTTP $code)"
              sed -E 's/[A-Za-z0-9_-]{16,}/***masked***/g' "$response" | head -c 400
              exit 1
              ;;
          esac
